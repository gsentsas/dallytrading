name: PR15 Hotfix CI

on:
  pull_request:
    branches: [main]

jobs:
  freight-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Apps Script syntax
        run: |
          cp integrations/google-sheets/freight-sync/Code.gs /tmp/Code.js
          cp integrations/google-sheets/freight-sync/Cash.gs /tmp/Cash.js
          cp integrations/google-sheets/freight-sync/Pdf.gs /tmp/Pdf.js
          node --check /tmp/Code.js
          node --check /tmp/Cash.js
          node --check /tmp/Pdf.js

      - name: Freight Sheet regression suite
        run: |
          set -e
          for T in \
            scripts/test_freight_sheet_keys.js \
            scripts/test_freight_sheet_identity_collision.js \
            scripts/test_freight_sheet_layout_edges.js \
            scripts/test_freight_sheet_refresh_concurrency.js \
            scripts/test_freight_sheet_replan_intent.js \
            scripts/test_freight_sheet_final_guards.js \
            scripts/test_freight_sheet_walkthrough_risks.js \
            scripts/test_freight_sheet_legacy_planned_guard.js \
            scripts/test_freight_sheet_user_correction_message.js \
            scripts/test_freight_sheet_binding_identity_backfill.js \
            scripts/test_freight_sheet_sync_planned_response_guard.js
          do
            echo "--- $T"
            node "$T"
          done
