####################################################################
# crm.dallytrading.com — directives nginx additionnelles (Plesk)
#
# À coller dans :
#   Plesk → Domaines → crm.dallytrading.com → Paramètres Apache & nginx
#         → « Directives nginx additionnelles »
#
# Prérequis IMPÉRATIFS avant activation :
#   1. Certificat Let's Encrypt émis pour crm.dallytrading.com
#      (aujourd'hui ABSENT : le HTTPS échoue avec une erreur TLS 18).
#   2. Conteneur dally-odoo démarré et à l'écoute sur 127.0.0.1:18169.
#   3. Case « Proxy mode » de Plesk DÉCOCHÉE : nginx sert directement,
#      sans passer par Apache. Apache n'a rien à faire dans cette chaîne.
#
# Ne cible QUE l'instance DallyTrading (18169/18172). L'instance
# SEN CONTAINERS (18069/18072) n'est jamais référencée ici.
####################################################################

# ─── Sécurité : Database Manager inaccessible ─────────────────────
# Défense en profondeur. `list_db = False` dans odoo.conf est la
# protection principale ; ce blocage réseau en est le doublon, car une
# configuration Odoo peut être modifiée par erreur lors d'une mise à jour.
# Placé en premier : nginx applique la correspondance de préfixe la
# plus longue, ces blocs gagnent donc sur « location / ».
location /web/database {
    deny all;
    return 404;
}
location /web/database/manager  { deny all; return 404; }
location /web/database/selector { deny all; return 404; }
location /web/database/create   { deny all; return 404; }
location /web/database/duplicate { deny all; return 404; }
location /web/database/drop     { deny all; return 404; }
location /web/database/backup   { deny all; return 404; }
location /web/database/restore  { deny all; return 404; }
location /web/database/list     { deny all; return 404; }

# L'API RPC historique n'est pas utilisée par le site : la fermer réduit
# la surface d'attaque. À rouvrir uniquement si LegacyRpcAdapter devient
# nécessaire (cf. docs/API.md).
location /xmlrpc { deny all; return 404; }
location /jsonrpc { deny all; return 404; }

# ─── En-têtes de sécurité ─────────────────────────────────────────
# HSTS délibérément ABSENT à ce stade (§12) : à activer seulement après
# validation complète du HTTPS. Une fois envoyé, l'en-tête est mémorisé
# par les navigateurs pour toute sa durée — une erreur de configuration
# rendrait le domaine inaccessible pendant des mois.
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# ─── Fichiers statiques Odoo ──────────────────────────────────────
# Les assets Odoo portent une empreinte dans leur URL : ils sont
# immuables et peuvent être mis en cache agressivement.
location /web/static/ {
    proxy_pass http://127.0.0.1:18169;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_valid 200 302 60m;
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ─── WebSocket (bus temps réel Odoo : Discuss, notifications) ─────
# Odoo 19 sert le temps réel via gevent sur 8072 → 18172. Sans ce bloc,
# Discuss et les notifications échouent silencieusement.
location /websocket {
    proxy_pass http://127.0.0.1:18172;
    proxy_http_version 1.1;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Une connexion WebSocket reste ouverte longtemps : sans ces délais
    # élevés, nginx la coupe toutes les 60 s.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_connect_timeout 10s;
    proxy_buffering off;
}

# Le canal long-polling historique passe par le même service gevent.
location /longpolling {
    proxy_pass http://127.0.0.1:18172;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# ─── Application Odoo ─────────────────────────────────────────────
location / {
    proxy_pass http://127.0.0.1:18169;
    proxy_redirect off;
    proxy_http_version 1.1;

    # Odoo tourne avec proxy_mode = True : il fait confiance à ces
    # en-têtes pour reconstruire les URL et journaliser la vraie IP
    # cliente. Les omettre produirait des liens en http:// dans les
    # e-mails et fausserait toute la journalisation.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Import de données, impression PDF et installation de modules
    # dépassent facilement 60 s.
    proxy_connect_timeout 60s;
    proxy_send_timeout    720s;
    proxy_read_timeout    720s;

    # Téléversements : documents de fret, scans douaniers, photos.
    client_max_body_size 100m;
    client_body_timeout  300s;

    proxy_buffers 16 64k;
    proxy_buffer_size 128k;
    proxy_busy_buffers_size 256k;
}

# ─── Compression ──────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml;
