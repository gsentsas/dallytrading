####################################################################
# dallytrading.com — directives nginx additionnelles (Plesk)
#
# À coller dans :
#   Plesk → Domaines → dallytrading.com → Paramètres Apache & nginx
#         → « Directives nginx additionnelles »
#
# Prérequis, état VÉRIFIÉ le 13/08/2026 :
#   1. Enregistrement DNS www.dallytrading.com → 217.154.121.244.
#      SATISFAIT. La note précédente, qui l'annonçait absent, était périmée.
#   2. Certificat Let's Encrypt couvrant dallytrading.com ET www.
#      SATISFAIT : certificat wildcard *.dallytrading.com valide
#      jusqu'au 10/11/2026.
#   3. Application Next.js à écoute sur 127.0.0.1:3010.
#      SATISFAIT : service systemd actif et pages publiques validées.
#   4. Case « Proxy mode » de Plesk DÉCOCHÉE.
#
# Configuration active en production. La redirection www 301 vers le domaine
# canonique est également active dans Plesk.
####################################################################

# ─── En-têtes de sécurité ─────────────────────────────────────────
# HSTS est actif et vérifié sur le vhost Plesk ; il est géré à ce niveau.
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

# ─── Assets Next.js ───────────────────────────────────────────────
# /_next/static porte une empreinte de build : immuable, cache long.
location /_next/static/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host $host;
    expires 365d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Les images optimisées par Next.js sont coûteuses à régénérer.
location /_next/image {
    proxy_pass http://127.0.0.1:3010;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public";
}

# ─── Routes API (BFF) ─────────────────────────────────────────────
# C'est ici que le serveur Next.js dialogue avec Odoo. La clé API ne
# quitte jamais le serveur : le navigateur ne parle qu'à /api (§2, §54).
location /api/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Téléversements des formulaires de devis (photos, documents).
    client_max_body_size 25m;
    proxy_read_timeout 120s;

    # Les réponses d'API ne doivent jamais être mises en cache :
    # elles sont propres à un utilisateur et à une session.
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# ─── Application ──────────────────────────────────────────────────
# ─── Page de suivi : ne pas journaliser le token ──────────────────
#
# Même raison que côté CRM : /tracking?ref=…&t=<secret> est journalisé
# intégralement par nginx. `access_log off` est la seule option disponible
# dans les directives Plesk (log_format est de niveau http).
location /tracking {
    access_log off;

    proxy_pass http://127.0.0.1:3010;
    proxy_redirect off;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 30s;
    proxy_read_timeout    120s;
    client_max_body_size 25m;
}

location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_redirect off;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Hot-reload en développement et streaming SSR en production.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_connect_timeout 30s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;

    client_max_body_size 25m;
}

# ─── Compression ──────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml
    application/rss+xml image/svg+xml;
